name: Runtime smoke

on:
  pull_request:
    paths:
      - 'bpf/**'
      - 'src/**'
      - 'include/**'
      - 'scripts/runtime-smoke.sh'
      - 'Makefile'
      - '.github/workflows/runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    name: Privileged BPF runtime smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install runtime toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            linux-tools-common linux-tools-generic clang llvm \
            libbpf-dev libelf-dev zlib1g-dev pkg-config curl python3
      - name: Run real load/attach smoke
        run: sudo bash scripts/runtime-smoke.sh
