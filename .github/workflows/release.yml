name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish source release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi
          NOTES=".github/release-notes/${TAG}.md"
          test -s "$NOTES" || { echo "missing release notes: $NOTES" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            linux-tools-common linux-tools-generic clang llvm \
            libbpf-dev libelf-dev zlib1g-dev pkg-config

      - name: Prove tagged source builds
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          make clean all VERSION="$VERSION"
          test "$(./build/kernwatch --version)" = "kernwatch $VERSION"
          make test

      - name: Create deterministic source bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix="kernwatch-${VERSION}/" "$GITHUB_SHA" \
            | gzip -n > "dist/kernwatch-${VERSION}-source.tar.gz"
          (
            cd dist
            sha256sum "kernwatch-${VERSION}-source.tar.gz" > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/kernwatch-${VERSION}-source.tar.gz" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --title "Karzoun KernWatch ${TAG}" \
            --notes-file "$NOTES"
